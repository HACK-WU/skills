<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目知识地图</title>
<style>
/* 字体去重注入点（build 导出单文件时填充） */
/* __ATLAS_FONTS__ */
:root{
  --paper:#f6f7f3; --surface:#fffefa; --surface-pure:#fff;
  --ink:#17211c; --ink-2:#4c5951; --ink-3:#7d8981;
  --line:#e1e6de; --line-2:#edf0e9;
  --accent:#1d6b4f; --accent-2:#124c38; --wash:#eaf2ec;
  --amber:#80601d; --amber-wash:#faf3e3;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sh-1:0 1px 2px rgba(23,33,28,.035),0 5px 16px -12px rgba(23,33,28,.16);
  --sh-2:0 1px 2px rgba(23,33,28,.04),0 20px 45px -28px rgba(23,33,28,.28);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--ink);
  background:
    radial-gradient(ellipse 65% 42% at 82% 0%,rgba(207,220,207,.3),transparent 72%),
    linear-gradient(180deg,#fafaf7 0%,var(--paper) 52%,#f4f5f0 100%) fixed;
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:#d8e7dc;color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:5px}

.buildbar{display:flex;align-items:center;gap:9px;padding:14px 32px 0;
  font:11px var(--mono);color:#8b968c;
  letter-spacing:.02em;flex-wrap:wrap}
.buildbar b{color:#2b3b31;font-weight:600}
.buildbar .bb-text{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.buildbar .dot{width:3px;height:3px;border-radius:50%;background:#c7d0c7;flex:none}
.buildbar .bb-meta{margin-left:auto;font:10.5px var(--mono);color:#9aa49b;font-variant-numeric:tabular-nums;letter-spacing:.025em;white-space:nowrap}
.buildbar code{font-family:var(--mono);color:#4c5951;background:none;padding:0;border:0}
.export-btn{display:inline-flex;align-items:center;gap:5px;margin-left:8px;flex:none;
  font:11px/1 -apple-system,sans-serif;color:var(--accent-2);background:var(--surface-pure);
  border:1px solid #d7e4da;padding:3px 9px;border-radius:6px;cursor:pointer;
  transition:background .16s,border-color .16s,transform .16s}
.export-btn:hover{background:var(--wash);border-color:#c5dccb}
.export-btn:active{transform:translateY(1px)}
.export-btn[disabled]{opacity:.55;cursor:default;transform:none}
.toc-btn{display:none;align-items:center;gap:6px;font:12px/1 -apple-system,sans-serif;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);
  padding:7px 10px;border-radius:8px;cursor:pointer;box-shadow:var(--sh-1);
  transition:background .18s,border-color .18s,transform .18s}
.toc-btn:hover{background:var(--wash);border-color:#d6e3d9}
.toc-btn:active{transform:translateY(1px)}

/* ── 骨架 ── */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);margin:0}
.side{padding:24px 16px 40px 32px;border-right:1px solid rgba(221,227,218,.88);
  background:rgba(255,255,252,.2);position:sticky;top:0;height:100vh;overflow:auto}
main{padding:34px 44px 96px 40px;min-width:0;max-width:1200px}
main>:first-child{animation:page-in .38s var(--ease) both}
@keyframes page-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── 侧栏：无卡片，靠字重与缩进分层 ── */
.nav-home{font-size:13px;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;
  color:var(--ink);margin-bottom:2px;transition:background .18s,color .18s,box-shadow .18s}
.nav-home:hover{background:rgba(255,255,255,.72);box-shadow:var(--sh-1)}
.nav-home.on{background:#eaf1ec;color:var(--accent-2)}
.grp-h{display:flex;align-items:center;justify-content:space-between;
  margin:18px 0 5px;padding:0 11px 0 calc(11px + var(--d,0) * 12px);font-size:11.5px;
  color:#7f8b82;font-weight:600;letter-spacing:.01em;cursor:pointer;user-select:none;
  border-radius:6px;transition:color .15s}
.grp-h:hover{color:var(--ink-2)}
.grp-h .grp-t{display:inline-flex;align-items:center;gap:5px;min-width:0}
.grp-h .caret{font:9px/1 var(--mono);color:#b9c3bb;flex:none;transition:color .15s}
.grp-h:hover .caret{color:var(--accent)}
.grp-h.sub{margin:12px 0 3px;font-size:11px;color:#8b968e}
.grp-h .n{font:9.5px var(--mono);letter-spacing:0;color:#a8b2aa}
.grp-h.has-cur{color:var(--accent-2)}
.grp-h.has-cur .caret{color:var(--accent)}
.grp-h.has-cur .n{color:var(--accent)}
.nav-i{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 11px 7px calc(11px + var(--d,0) * 12px);border-radius:8px;
  font-size:13px;color:var(--ink-2);cursor:pointer;
  transition:background .18s,color .18s,box-shadow .18s,transform .18s}
.nav-i:not([data-d="0"]){font-size:12.5px;color:#6f7b73}
.nav-i:hover{background:rgba(255,255,255,.74);color:var(--ink);box-shadow:var(--sh-1);transform:translateX(1px)}
.nav-i.on{background:linear-gradient(135deg,#e7f0e9,#f0f5ef);color:var(--accent-2);font-weight:650;
  box-shadow:inset 0 0 0 1px rgba(29,107,79,.075)}
.nav-i.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:3px;background:var(--accent);box-shadow:0 0 8px rgba(29,107,79,.18)}
.nav-i .tag{font:9.5px var(--mono);color:#96a098;font-variant-numeric:tabular-nums}
.nav-i.on .tag{color:var(--accent)}

/* ── 首页 ── */
.hero{max-width:700px;margin:12px 0 44px}
.hero h1{font-size:32px;line-height:1.25;letter-spacing:-.035em;margin:0 0 16px;font-weight:720;
  color:#142019;text-wrap:balance}
.hero p{margin:0;font-size:15px;line-height:1.82;color:#4b5850;letter-spacing:.002em}
.hero .note{margin-top:20px;display:flex;gap:9px;align-items:flex-start;
  font-size:12.5px;line-height:1.75;color:var(--amber);
  background:linear-gradient(135deg,rgba(251,245,230,.9),rgba(250,246,236,.7));
  border:1px solid #eee4cd;border-radius:11px;padding:12px 15px;box-shadow:0 6px 20px -18px rgba(128,96,29,.5)}
.hero .note b{font-weight:700}

.sec{margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;
  padding:0 12px 10px;border-bottom:1px solid rgba(216,223,214,.85)}
.sec-h .name{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#2a3a30}
.sec-h .q{font-size:12.5px;color:#849087}
.sec-h .n{margin-left:auto;font:10px var(--mono);color:#98a299;font-variant-numeric:tabular-nums}
/* 目录行：稀疏目录不用卡片网格（1-2 项时空列会把右侧撑空） */
.rows{display:flex;flex-direction:column;padding:5px 7px;background:rgba(255,255,252,.46);
  border:1px solid rgba(226,231,223,.7);border-radius:14px;box-shadow:0 10px 30px -28px rgba(23,33,28,.5)}
.row{display:flex;align-items:center;gap:16px;padding:14px 12px;border-radius:9px;
  cursor:pointer;border-bottom:1px solid var(--line-2);
  transition:background .18s,box-shadow .18s,transform .18s var(--ease)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-pure);box-shadow:var(--sh-1);transform:translateY(-1px)}
.row:active{transform:translateY(0)}
.row .ttl{flex:0 0 auto;min-width:210px;font-size:13.5px;font-weight:650;letter-spacing:-.012em;color:#24332a}
.row .desc{flex:1;min-width:0;font-size:12.5px;color:#7c8880;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.row .arrow{flex:0 0 auto;color:#b6c2b8;font-size:14px;transition:transform .18s var(--ease),color .18s}
.row:hover .arrow{transform:translateX(3px);color:var(--accent)}
.pill{font-size:10px;line-height:1;padding:5px 7px;border-radius:6px;
  background:#f1f3ee;color:#78847b;letter-spacing:.025em;white-space:nowrap;
  border:1px solid #e9ede6;font-variant-numeric:tabular-nums}
.pill.t{font-family:var(--mono);letter-spacing:0}
.pill.code{background:#e9f2eb;color:var(--accent-2);border-color:#dfeae1}

/* ── 图页 ── */
.crumb{font:10.5px var(--mono);color:#89948c;margin:0 0 15px;letter-spacing:.025em}
.pg-head{max-width:840px;margin:0 0 26px}
.pg-head h1{font-size:26px;line-height:1.3;letter-spacing:-.028em;margin:0 0 11px;font-weight:700;color:#17241c}
.pg-head p{margin:0;font-size:14px;line-height:1.8;color:var(--ink-2)}

.fig{background:var(--surface-pure);border:1px solid #dfe6dc;border-radius:16px;
  overflow:hidden;box-shadow:var(--sh-2);margin:0 0 11px}
.fig-bar{display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid #e8ece5;background:linear-gradient(180deg,#fdfefb,#fafcf8)}
.fig-bar .chip{font:10px var(--mono);color:var(--accent-2);background:#e8f1e9;
  padding:3px 7px;border-radius:5px;letter-spacing:.025em;border:1px solid #dde9df}
.fig-bar .sep{width:3px;height:3px;border-radius:50%;background:#c7d0c7;flex:none}
.fig-bar .t{font-size:11px;color:#879289;font-variant-numeric:tabular-nums}
.fig-bar a{margin-left:auto;font-size:11.5px;color:var(--accent-2);text-decoration:none;
  padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-pure);
  box-shadow:var(--sh-1);transition:background .18s,border-color .18s,transform .18s}
.fig-bar a:hover{background:var(--wash);border-color:#d7e4da;transform:translateY(-1px)}
.fig-body{padding:8px 0;background:
  radial-gradient(ellipse 70% 90% at 50% 40%,rgba(237,244,237,.52),transparent 80%),
  radial-gradient(circle at 1px 1px,#e5ebe2 1px,transparent 0) 0 0/22px 22px,#fdfefc}
.fig-body .ph{padding:46px 18px;text-align:center;font-size:13px;color:var(--ink-3)}
.hint{margin:11px 0 0;font-size:11.5px;color:#7f8b82;display:flex;gap:7px;align-items:center}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);
  opacity:.65;flex:none;box-shadow:0 0 0 3px rgba(29,107,79,.08)}

/* ── 解读：两栏 dt/dd ── */
.read{margin:34px 0 0;display:grid;grid-template-columns:132px minmax(0,1fr);column-gap:20px}
.read-h{grid-column:1/-1;font-size:10.5px;letter-spacing:.09em;color:#7f8b82;font-weight:700;margin:0 0 4px;padding-bottom:10px;
  border-bottom:1px solid var(--line)}
.read dt{font-size:12.5px;font-weight:650;color:#2b3b31;padding:12px 0 0;line-height:1.65}
.read dd{margin:0;font-size:12.5px;line-height:1.78;color:#56635a;
  padding:12px 0;border-bottom:1px solid var(--line-2)}

/* ── 文档 chip ── */
.docs{margin:32px 0 0}
.docs-h{font-size:10.5px;letter-spacing:.09em;color:#7f8b82;
  font-weight:700;margin:0 0 13px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.docs ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.docs ul.codelist{flex-direction:column;flex-wrap:nowrap;gap:2px}
.codelist li{display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:8px;
  cursor:pointer;font:11.5px var(--mono);color:#56645a;transition:background .15s}
.codelist li:hover{background:rgba(255,255,252,.9);box-shadow:0 2px 10px -8px rgba(23,33,28,.4)}
.codelist li .p{color:var(--accent-2);font-weight:600;flex:none}
.codelist li .sym{color:#2b3b31;background:#eef2ea;padding:1px 6px;border-radius:4px;flex:none;font-size:11px}
.codelist li .why{color:#849087;font-family:-apple-system,sans-serif;font-size:11.5px;margin-left:auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docs li{font:11px var(--mono);color:#56645a;background:rgba(255,255,252,.72);
  padding:6px 9px;border-radius:7px;border:1px solid #e4e9e1;box-shadow:0 2px 8px -7px rgba(23,33,28,.35)}

/* ── 代码抽屉 ── */
.codepanel{position:fixed;top:0;right:0;height:100vh;width:min(960px,70vw);
  background:var(--surface);border-left:1px solid #d9e1d6;
  box-shadow:-28px 0 70px -32px rgba(15,26,21,.45);transform:translateX(103%);
  transition:transform .28s var(--ease);z-index:50;
  display:flex;flex-direction:column}
.codepanel.on{transform:none}
.cp-head{padding:18px 20px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffefa,#fbfcf8)}
.cp-title{display:flex;align-items:center;gap:9px}
.cp-title .n{font-size:14px;font-weight:700;letter-spacing:-.01em}
.cp-title .badge{font:10px var(--mono);color:var(--accent-2);background:var(--wash);
  padding:3px 6px;border-radius:5px;border:1px solid #dfe9e0}
.cp-close{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;
  color:var(--ink-3);cursor:pointer;padding:4px 8px;border-radius:7px;transition:background .18s,color .18s}
.cp-close:hover{background:var(--line-2);color:var(--ink)}
.cp-path{margin-top:8px;font:11px var(--mono);color:var(--ink-3);word-break:break-all;line-height:1.65}
.cp-path i{color:var(--accent-2);font-style:normal}
.cp-why{padding:13px 20px;font-size:12.5px;line-height:1.75;color:var(--ink-2);
  border-bottom:1px solid var(--line);background:#fdfdf9}
.cp-why .w{margin-top:6px;font-size:10.5px;color:var(--ink-3)}
.cp-code{margin:0;flex:1;overflow:auto;background:#101a15;color:#d4dfd7;
  font:12.5px/1.95 var(--mono);padding:15px 0}
.cp-code .cl{display:flex;white-space:pre;transition:background .15s}
.cp-code .cl:hover{background:rgba(255,255,255,.025)}
.cp-code .ln{flex:0 0 56px;text-align:right;padding-right:14px;color:#52665a;
  user-select:none;font-variant-numeric:tabular-nums}
.cp-code .lc{flex:1;padding-right:18px}
.cp-code .k{color:#e7afd3}.cp-code .s{color:#9ed6ac}.cp-code .c{color:#6e8275;font-style:italic}.cp-code .n{color:#e6c889}
.cp-empty{padding:44px 24px;text-align:center;font-size:12.5px;color:#91a398;line-height:1.8}
.cp-foot{padding:11px 20px;border-top:1px solid var(--line);font:10.5px var(--mono);
  color:var(--ink-3);font-variant-numeric:tabular-nums;background:#fbfcf8}

/* ── 滚动条 ── */
.side::-webkit-scrollbar,.cp-code::-webkit-scrollbar{width:8px;height:8px}
.side::-webkit-scrollbar-thumb,.cp-code::-webkit-scrollbar-thumb{background:#d5ddd3;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.side::-webkit-scrollbar-thumb:hover{background:#c4cfc2;border:2px solid transparent;background-clip:padding-box}
.cp-code::-webkit-scrollbar-thumb{background:#33483c;border:2px solid transparent;background-clip:padding-box}

@media(max-width:1080px){
  .shell{grid-template-columns:1fr}
  .toc-btn{display:inline-flex}
  .side{position:fixed;top:0;left:0;right:0;bottom:0;height:auto;z-index:35;
    background:rgba(248,249,245,.98);backdrop-filter:blur(18px);border-right:0;padding:16px 20px 40px;
    transform:translateX(-100%);transition:transform .24s var(--ease);overflow:auto}
  .side.open{transform:none;box-shadow:0 20px 50px rgba(23,33,28,.12)}
  main{padding:26px 20px 76px;max-width:none}
  /* 图不被压缩到不可读：允许横向滚动，保持最小可读宽度 */
  .fig-body{overflow-x:auto}
  .fig-body>div{min-width:680px}
  .codepanel{top:auto;bottom:0;left:0;right:0;width:100%;height:64vh;
    border-left:0;border-top:1px solid #d9e1d6;border-radius:18px 18px 0 0;
    transform:translateY(103%);box-shadow:0 -28px 70px -32px rgba(15,26,21,.45)}
  .codepanel.on{transform:none}
  .cp-head{padding-top:13px}
}
@media(max-width:640px){
  /* 窄屏只留「目录 + 导出」一行，生成基线文字让位给内容 */
  .buildbar{padding:10px 16px 0;gap:8px;flex-wrap:nowrap}
  .buildbar .bb-text{display:none}
  .buildbar .bb-meta{display:none}
  .export-btn{margin-left:auto}
  .toc-btn{padding:6px 8px;font-size:11px}
  .hero h1{font-size:25px;letter-spacing:-.025em}
  .pg-head h1{font-size:22px}
  .read{grid-template-columns:1fr}
  .read dt{padding-bottom:0}
  .read dd{padding-top:4px}
  main{padding:22px 16px 64px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="buildbar" id="buildbar">
  <button class="toc-btn" id="tocBtn" aria-label="打开目录">☰ 目录</button>
  <span class="bb-text" id="bbText"></span>
  <span class="bb-meta" id="bbMeta"></span>
  <button class="export-btn" id="exportBtn" title="导出 Markdown 目录包">导出 ↓</button>
</div>

<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<aside class="codepanel" id="panel" aria-hidden="true">
  <div class="cp-head">
    <div class="cp-title">
      <span class="n" id="cpName">节点</span>
      <span class="badge" id="cpBadge" hidden>concept</span>
      <button class="cp-close" id="cpClose" title="关闭（ESC）">×</button>
    </div>
    <div class="cp-path" id="cpPath"></div>
  </div>
  <div class="cp-why" id="cpWhy" hidden></div>
  <pre class="cp-code" id="cpCode"></pre>
  <div class="cp-foot" id="cpFoot"></div>

  </style>
  <g data-node-id="root"><rect class="bx" x="356" y="24" width="188" height="52" rx="9"/><text class="lb" x="450" y="47">config.json</text><text class="sb" x="450" y="64">唯一配置文件</text></g>

  <g data-node-id="scopes"><rect class="bx" x="672" y="132" width="210" height="56" rx="9"/><text class="lb" x="777" y="156">scopes</text><text class="sb" x="777" y="174">每个库的目录与规则</text></g>

<div id="view-sources" hidden></div>

<script>
(async function(){
  const DEMO = JSON.parse(document.getElementById('demo-config').textContent);
  let SITE = DEMO, PAGES = DEMO.pages || {}, SNIP = DEMO.snippets || {};
  let ITEMS = [], SOURCE = 'demo', cur = 'home', MOUNT_SEQ = 0;

  // nav 是任意深度的树：有 children → 分组，否则 → 页面（page 或 id）
  const kidsOf = it => (Array.isArray(it.children) ? it.children.filter(Boolean) : null);
  function leaves(){
    const out = [];
    (function walk(items, path, root, idx){
      for(let i = 0; i < (items || []).length; i++){
        const it = items[i];
        if(!it || typeof it !== 'object') continue;
        const kids = kidsOf(it);
        const label = it.name || it.id || '';
        const myIdx = idx.concat(i);
        if(kids && kids.length){
          walk(kids, path.concat(label), root || it, myIdx);
        }else{
          const pid = it.page || it.id;
          if(!pid) continue;
          const grp = root || it;
          out.push({ id: it.id || pid, page: pid, depth: path.length, path, idx: myIdx,
                     group: grp.id, groupName: path[0] || '', label });
        }
      }
    })(SITE.nav, [], null, []);
    return out;
  }
  // 折叠状态：key = 节点在 nav 里的索引链（如 "1.0.2"）
  const COLLAPSED = new Set();
  const idxKey = idx => idx.join('.');
  const DEFAULT_COLLAPSE_DEPTH = 2;   // 第 3 层及更深默认折叠

  function initCollapsed(){
    COLLAPSED.clear();
    (function walk(items, depth, idx){
      (items || []).forEach((it, i) => {
        const kids = kidsOf(it);
        if(kids && kids.length){
          const my = idx.concat(i);
          if(depth >= DEFAULT_COLLAPSE_DEPTH) COLLAPSED.add(idxKey(my));
          walk(kids, depth + 1, my);
        }
      });
    })(SITE.nav, 0, []);
  }
  // 展开到某个页面：把它路径上的分组从折叠集合里移除
  // 展开到某页：把它索引链上的每个前缀（即路径上的分组）从折叠集合移除。
  // 用索引而非分组名，避免同名分组串到错误分支。
  function expandPathTo(pid){
    const it = ITEMS.find(i => i.page === pid);
    if(!it || !it.idx) return;
    for(let n = 1; n < it.idx.length; n++){
      COLLAPSED.delete(idxKey(it.idx.slice(0, n)));
    }
  }
  function countLeaves(it){
    const kids = kidsOf(it);
    if(kids && kids.length) return kids.reduce((a, k) => a + countLeaves(k), 0);
    return 1;
  }
  const codeOf = pid => ((PAGES[pid] || {}).code || []).filter(c => c.file);
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // 状态源用 hash：支持 #page 深链与后退
  const fromHash = () => {
    const h = location.hash.replace('#', '');
    return (h && ITEMS.some(i => i.page === h)) ? h : 'home';
  };
  window.addEventListener('hashchange', () => {
    cur = fromHash();
    expandPathTo(cur);
    render();
  });

  // 当前页的索引链：用来判断某个折叠分组是不是它的祖先
  function curIdx(){
    const it = ITEMS.find(i => i.page === cur);
    return it && it.idx ? it.idx : null;
  }
  function isAncestor(prefix, full){
    if(!full || prefix.length >= full.length) return false;
    for(let i = 0; i < prefix.length; i++) if(prefix[i] !== full[i]) return false;
    return true;
  }

  function navTree(items, depth, idxPath){
    let h = '';
    const idx = idxPath || [];
    for(let i = 0; i < (items || []).length; i++){
      const it = items[i];
      if(!it || typeof it !== 'object') continue;
      const kids = kidsOf(it);
      const myIdx = idx.concat(i);
      const key = idxKey(myIdx);
      if(kids && kids.length){
        const folded = COLLAPSED.has(key);
        const hasCur = folded && isAncestor(myIdx, curIdx());
        h += '<div class="grp-h' + (depth ? ' sub' : '') + ' ' + (folded ? 'folded' : '')
          + (hasCur ? ' has-cur' : '') + '"'
          + ' data-g="' + key + '" style="--d:' + depth + '">'
          + '<span class="grp-t"><i class="caret">' + (folded ? '▸' : '▾') + '</i>'
          + '<span>' + esc(it.name || it.id) + '</span></span>'
          + '<span class="n">' + countLeaves(it) + '</span></div>';
        if(!folded) h += navTree(kids, depth + 1, myIdx);
      }else{
        const pid = it.page || it.id;
        if(!pid) continue;
        const p = PAGES[pid] || {};
        const n = codeOf(pid).length;
        h += '<a><div class="nav-i' + (cur===pid?' on':'') + '" data-id="' + pid
          + '" data-d="' + depth + '" style="--d:' + depth + '">'
          + '<span>' + esc(p.title || pid) + '</span>'
          + (n ? '<span class="tag">' + n + '</span>' : '') + '</div></a>';
      }
    }
    return h;
  }
  function renderSide(){
    const side = $('#side');
    const keepScroll = side ? side.scrollTop : 0;
    let h = '<a><div class="nav-home ' + (cur==='home'?'on':'') + '" data-id="home">总览</div></a>';
    h += navTree(SITE.nav, 0, []);
    side.innerHTML = h;
    $('#side').querySelectorAll('[data-id]').forEach(el => {
      el.onclick = () => go(el.dataset.id);
    });
    $('#side').querySelectorAll('.grp-h[data-g]').forEach(el => {
      el.onclick = ev => {
        ev.stopPropagation();
        const k = el.dataset.g;
        if(COLLAPSED.has(k)) COLLAPSED.delete(k); else COLLAPSED.add(k);
        renderSide();
      };
    });
    // 重绘后恢复滚动位置（深目录下折叠一次就跳回顶部很难用）
    if(side) side.scrollTop = keepScroll;
  }

  function renderHome(){
    let h = '<div class="hero"><h1>' + esc(SITE.subtitle || '先建立整体认知') + '</h1>'
      + '<p>' + esc(SITE.intro || '') + '</p>'
      + '<div class="note"><span>▸</span><span>' + (SITE.notice || '图为内联 SVG：带代码的节点可点击，其余为概念节点。') + '</span></div></div>';
    for(const g of SITE.nav){
      const pages = ITEMS.filter(i => i.group === g.id);
      h += '<section class="sec"><div class="sec-h"><span class="name">' + esc(g.name) + '</span>'
        + '<span class="q">' + esc(g.q || '') + '</span><span class="n">' + pages.length + '</span></div><div class="rows">';
      for(const it of pages){
        const p = PAGES[it.page] || {};
        const n = codeOf(it.page).length;
        h += '<div class="row" data-id="' + it.page + '">'
          + '<span class="ttl">' + esc(p.title || it.page) + '</span>'
          + '<span class="desc">' + esc(p.summary || '（该页未配置 summary）') + '</span>'
          + '<span class="meta"><span class="pill t">' + esc(p.type || 'page') + '</span>'
          + '<span class="pill">' + ((p.points || []).length) + ' 解读</span>'
          + (n ? '<span class="pill code">' + n + ' 可点</span>' : '')
          + '</span><span class="arrow">→</span></div>';
      }
      h += '</div></section>';
    }
    $('#main').innerHTML = h;
    $('#main').querySelectorAll('.row').forEach(el => {
      el.onclick = () => go(el.dataset.id);
    });
    window.scrollTo(0, 0);
  }

  function renderPage(pid){
    const p = PAGES[pid];
    const it = ITEMS.find(i => i.page === pid) || {};
    if(!p){ $('#main').innerHTML = '<div class="hint">页面配置缺失：' + esc(pid) + '</div>'; return; }
    const n = codeOf(pid).length;
    const crumbPath = (it.path || []).join(' / ');
    let h = '<div class="crumb">' + esc(crumbPath ? crumbPath + ' / ' : '') + esc(p.title || pid) + '</div>';
    h += '<div class="pg-head"><h1>' + esc(p.title || pid) + '</h1><p>' + esc(p.summary || '') + '</p></div>';
    h += '<div class="fig"><div class="fig-bar">'
      + '<span class="chip">' + esc(p.type || '') + '</span><span class="sep"></span>'
      + '<span class="t">' + esc(SITE.generated_at || '') + '</span><span class="sep"></span>'
      + '<span class="t">' + (n ? n + ' 个节点可点' : '纯展示') + '</span>'
      + (p.interactive ? '<a href="' + esc(p.interactive) + '" target="_blank" rel="noopener">交互版 ↗</a>' : '')
      + '</div><div class="fig-body" id="viewbox"><div class="ph">加载图中…</div></div></div>';
    if(n) h += '<div class="hint">图中 ' + n + ' 个节点有代码，点击可看生成时的源码快照；其余节点为外部依赖或纯概念，点击会给出说明。</div>';

    h += '<dl class="read"><div class="read-h">怎么读这张图</div>';
    for(const pt of (p.points || [])) h += '<dt>' + esc(pt[0]) + '</dt><dd>' + esc(pt[1]) + '</dd>';
    h += '</dl>';

    const codes = (p.code || []).filter(c => c.file);
    h += '<div class="docs"><div class="docs-h">对应代码块</div><ul class="codelist">';
    if(!codes.length){
      h += '<li style="cursor:default"><span class="why" style="margin-left:0">该页没有配置代码位置</span></li>';
    }
    for(const c of codes){
      const sn = (SNIP[pid] || {})[c.id] || {};
      const sym = c.symbol || sn.symbol || '';
      h += '<li data-node="' + esc(c.id) + '">'
        + '<span class="p">' + esc(c.file) + ':' + (c.lines ? c.lines[0] : '-') + '-' + (c.lines ? c.lines[1] : '-') + '</span>'
        + (sym ? '<span class="sym">' + esc(sym) + '</span>' : '')
        + '<span class="why">' + esc(c.why || '') + '</span></li>';
    }
    h += '</ul>';
    // 参考文件只放"文档"，且排除已出现在代码块里的源码路径（否则纯重复）
    const codeFiles = new Set(codes.map(c => c.file));
    const extraDocs = (p.docs || []).filter(d => !codeFiles.has(d));
    if(extraDocs.length){
      h += '<div class="docs-h" style="margin-top:18px">参考文档</div><ul>';
      for(const d of extraDocs) h += '<li style="cursor:default"><span class="p">' + esc(d) + '</span></li>';
      h += '</ul>';
    }
    h += '</div>';

    $('#main').innerHTML = h;
    closeCode();
    $('#main').querySelectorAll('.codelist li[data-node]').forEach(el => {
      el.onclick = ev => { ev.stopPropagation(); openCode(pid, el.dataset.node); };
    });
    mountSvg(pid);
    window.scrollTo(0, 0);
  }

  const TPL_CACHE = {};
  async function fetchTemplate(pid, href){
    if(TPL_CACHE[pid]) return TPL_CACHE[pid];
    const r = await fetch(href, { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const tpl = document.createElement('template');
    tpl.setAttribute('data-view', pid);
    tpl.innerHTML = txt;
    document.getElementById('view-sources').appendChild(tpl);
    TPL_CACHE[pid] = tpl;
    return tpl;
  }

  async function mountSvg(pid){
    const box = $('#viewbox');
    if(!box) return;
    const seq = ++MOUNT_SEQ;
    const page = PAGES[pid] || {};
    const svgHref = page.svg || ((SITE.views_dir || 'views') + '/' + pid + '.svg');
    let tpl = null;
    try{
      if(SOURCE === 'demo'){
        tpl = document.querySelector('template[data-demo="1"][data-view="' + pid + '"]');
      }else{
        tpl = await fetchTemplate(pid, svgHref);
      }
    }catch(e){
      box.innerHTML = '<div class="ph">图源加载失败：' + esc(svgHref) +
        '<br><span style="opacity:.7">' + esc(e.message) + '　（file:// 下需起本地服务）</span></div>';
      return;
    }
    if(!tpl){
      box.innerHTML = '<div class="ph">该页没有图源：' +
        (SOURCE === 'demo' ? '内置示例里没有这一页' : '请在页面配置里填 svg 路径') + '</div>';
      return;
    }
    if(seq !== MOUNT_SEQ || cur !== pid) return;   // 期间已切页，丢弃过期结果
    box.innerHTML = '';
    const host = document.createElement('div');
    box.appendChild(host);
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.appendChild(tpl.content.cloneNode(true));
    // archify 导出的 SVG 带固定 width/height，去掉才能跟着容器缩放（手写图只有 viewBox，本就不受影响）
    const svgEl = shadow.querySelector('svg');
    if(svgEl){
      svgEl.removeAttribute('width');
      svgEl.removeAttribute('height');
      svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svgEl.style.width = '100%';
      svgEl.style.height = 'auto';
      svgEl.style.display = 'block';
    }
    const codeIds = new Set(codeOf(pid).map(c => c.id));
    const st = document.createElement('style');
    st.textContent = '[data-node-id]{cursor:pointer}'
      + '[data-bare]:hover{filter:drop-shadow(0 2px 8px rgba(23,33,28,.22))}';
    shadow.insertBefore(st, shadow.firstChild);
    // 所有节点都可点击：有代码的看代码，无代码的给出说明与相关文件
    shadow.querySelectorAll('[data-node-id]').forEach(g => {
      const id = g.getAttribute('data-node-id');
      g.setAttribute(codeIds.has(id) ? 'data-coded' : 'data-bare', '1');
      g.addEventListener('click', ev => { ev.stopPropagation(); pickNode(pid, g); });
    });
  }

  function pickNode(pid, g){
    const root = g.getRootNode();
    if(root && root.querySelectorAll) root.querySelectorAll('[data-coded].is-picked').forEach(x => x.classList.remove('is-picked'));
    g.classList.add('is-picked');
    openCode(pid, g.getAttribute('data-node-id'));
  }

  const KW = /^(const|let|var|function|async|await|return|if|else|for|while|class|export|import|from|new|throw|try|catch|finally|interface|type|extends|implements|of|in|typeof|void|delete|yield|switch|case|break|continue|default|public|private|readonly)\b/;
  function hl(line){
    let out = '', i = 0;
    while(i < line.length){
      const rest = line.slice(i);
      if(rest.startsWith('//')){ out += '<span class="c">' + esc(rest) + '</span>'; break; }
      let m;
      if((m = rest.match(/^(['"`])((?:\\.|(?!\1)[^\\])*)\1/))){ out += '<span class="s">' + esc(m[0]) + '</span>'; i += m[0].length; continue; }
      if((m = rest.match(/^(?:0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b/))){ out += '<span class="n">' + esc(m[0]) + '</span>'; i += m[0].length; continue; }
      if((m = rest.match(KW))){ out += '<span class="k">' + esc(m[0]) + '</span>'; i += m[0].length; continue; }
      if((m = rest.match(/^[A-Za-z_$][\w$]*/))){ out += esc(m[0]); i += m[0].length; continue; }
      out += esc(rest[0]); i++;
    }
    return out;
  }

  function openCode(pid, nodeId){
    const p = PAGES[pid] || {};
    const rec = (p.code || []).find(c => c.id === nodeId) || {};
    const snip = (SNIP[pid] || {})[nodeId] || {};
    const isConcept = !rec.file;
    $('#cpName').textContent = nodeId;
    $('#cpBadge').hidden = !isConcept;
    $('#cpBadge').textContent = 'concept';
    $('#cpPath').textContent = isConcept ? '该节点为概念节点，无对应源码' : '';

    const why = $('#cpWhy'), code = $('#cpCode'), foot = $('#cpFoot');
    if(isConcept){
      why.hidden = true;
      const rel = (p.docs || []);
      code.innerHTML = '<div class="cp-empty">该节点没有直接对应的源码'
        + (rel.length ? '<br><span style="opacity:.8">相关文件：' + rel.map(esc).join(' · ') + '</span>' : '')
        + '<br><span style="opacity:.55">通常出现在外部依赖或纯概念节点上；如需可点，在配置里给它填 file + lines</span></div>';
      foot.textContent = '';
    }else{
      const lines = String(snip.snippet || '').split('\n');
      const hasCode = !!snip.snippet;
      const startLine = snip.line || (rec.lines ? rec.lines[0] : 1);
      const endLine = snip.endLine || (rec.lines ? rec.lines[1] : startLine);
      $('#cpPath').innerHTML = '<i>' + esc(snip.file || rec.file) + '</i>:' + startLine + '-' + endLine;
      why.hidden = false;
      why.innerHTML = esc(rec.why || '') + '<div class="w">生成时的代码快照，不代表仓库当前 HEAD</div>';
      if(!hasCode){
        code.innerHTML = '<div class="cp-empty">该节点有代码位置，但片段表里没有内容'
          + '<br><span style="opacity:.7">先跑 collect_snippets.py，再刷新</span></div>';
        foot.textContent = '';
      }else{
        code.innerHTML = lines.map((l, i) =>
          '<div class="cl"><span class="ln">' + (startLine + i) + '</span><span class="lc">' + (hl(l) || ' ') + '</span></div>'
        ).join('');
        foot.textContent = '共 ' + lines.length + ' 行 · ' + (snip.commit || SITE.baseline || '') + ' · 与本次图集同期读取';
      }
    }
    $('#panel').classList.add('on');
    $('#panel').setAttribute('aria-hidden', 'false');
  }

  function closeCode(){
    const p = $('#panel');
    if(!p) return;
    p.classList.remove('on');
    p.setAttribute('aria-hidden', 'true');
    document.querySelectorAll('.fig-body div').forEach(box => {
      const sr = box.shadowRoot;
      if(sr) sr.querySelectorAll('[data-coded].is-picked').forEach(x => x.classList.remove('is-picked'));
    });
  }

  // ── 导出 Markdown 目录包（ZIP 由前端自写，不依赖第三方库）──
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf){
    let c = 0xFFFFFFFF;
    for(let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function deflateRaw(bytes){
    if(typeof CompressionStream === 'undefined') return null;
    try{
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(st).arrayBuffer());
    }catch(e){ return null; }
  }
  function dosStamp(d){
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()
    };
  }
  async function makeZip(entries){
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    const st = dosStamp(new Date());
    for(const e of entries){
      const name = enc.encode(e.name);
      const crc = crc32(e.data);
      const packed = await deflateRaw(e.data);
      const useDeflate = !!(packed && packed.length < e.data.length);
      const body = useDeflate ? packed : e.data;
      const method = useDeflate ? 8 : 0;
      const FLAG_UTF8 = 0x0800;   // bit 11：不置位时 Windows 解压中文目录会乱码

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
      lh.setUint16(6, FLAG_UTF8, true);  lh.setUint16(8, method, true);
      lh.setUint16(10, st.time, true);   lh.setUint16(12, st.date, true);
      lh.setUint32(14, crc, true);       lh.setUint32(18, body.length, true);
      lh.setUint32(22, e.data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, body);

      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
      cd.setUint16(8, FLAG_UTF8, true);  cd.setUint16(10, method, true);
      cd.setUint16(12, st.time, true);   cd.setUint16(14, st.date, true);
      cd.setUint32(16, crc, true);       cd.setUint32(20, body.length, true);
      cd.setUint32(24, e.data.length, true);
      cd.setUint16(28, name.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
      cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
      cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), name);

      offset += 30 + name.length + body.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
    eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, cdSize, true);    eocd.setUint32(16, offset, true);
    eocd.setUint16(20, 0, true);
    return new Blob(parts.concat(central, [new Uint8Array(eocd.buffer)]), { type: 'application/zip' });
  }

  // 导出用：递归出"叶子分组"，dir 是完整相对路径，path 是从根到叶的分组名
  function navGroups(){
    const out = [];
    (function walk(items, parentDir, parentPath){
      (items || []).forEach((it, i) => {
        if(!it || typeof it !== 'object') return;
        const label = it.name || it.id || ('item' + (i + 1));
        const seg = String(i + 1).padStart(2, '0') + '-'
          + String(label).replace(/[\/\\:*?"<>|]/g, '-');
        const dir = parentDir ? parentDir + '/' + seg : seg;
        const kids = kidsOf(it);
        if(kids && kids.length){
          walk(kids, dir, parentPath.concat(label));
        }else{
          const pid = it.page || it.id;
          if(!pid) return;
          // 叶子不再单独占一层目录：有父目录就并入，顶层页面才自建目录
          out.push({ dir: parentDir || dir, name: label, q: it.q || '', pages: [pid],
                     depth: parentPath.length, path: parentPath.concat(label) });
        }
      });
    })(SITE.nav, '', []);
    return out;
  }
  // 壳层已把各图的 @font-face 抽出来去重；导出成独立 SVG 时要补回去，
  // 否则图里的文字会 fallback 到系统字体（字形/间距全变）
  let SHELL_FONTS = null;
  function shellFonts(){
    if(SHELL_FONTS !== null) return SHELL_FONTS;
    const out = [];
    try{
      for(const sheet of document.styleSheets){
        let rules;
        try{ rules = sheet.cssRules; }catch(e){ continue; }
        for(const r of rules){
          if(r.type === 5 || (r.cssText || '').indexOf('@font-face') === 0) out.push(r.cssText);
        }
      }
    }catch(e){ /* 跨域样式表读不到，忽略 */ }
    SHELL_FONTS = out.join('\n');
    return SHELL_FONTS;
  }

  function normSvg(s, needFonts){
    s = String(s || '').trim();
    if(!s) return null;
    if(!/^<\?xml/.test(s)) s = '<?xml version="1.0" encoding="UTF-8"?>\n' + s;
    // 只看 <svg ...> 这一个标签：archify 的 svg 标签很长，xmlns 常在 400 字符之后，
    // 用固定长度截断会误判成"没有 xmlns"而重复添加，浏览器直接报 xmlns redefined
    const svgStart = s.indexOf('<svg');
    const gt = s.indexOf('>', svgStart);
    const head = (svgStart >= 0 && gt > svgStart) ? s.slice(svgStart, gt + 1) : s;
    if(!/xmlns\s*=\s*["']http:\/\/www\.w3\.org\/2000\/svg["']/.test(head)){
      s = s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    if(needFonts && !/@font-face/.test(s)){
      const fonts = shellFonts();
      if(fonts) s = s.replace(/(<svg[^>]*>)/, '$1<style>' + fonts + '</style>');
    }
    return s;
  }
  // 取某页的图源文本：
  //   内置示例态 / 导出单文件 → 用 data-demo 标记的 <template>（内容即示例或烘焙后的真实图）
  //   运行时真实配置       → 优先用已拉取的 template，否则按 page.svg 现场拉，避免误取内置示例
  async function svgSource(pid){
    if(SOURCE === 'demo'){
      const tpl = document.querySelector('template[data-demo="1"][data-view="' + pid + '"]');
      return tpl ? normSvg(tpl.innerHTML, tpl.hasAttribute('data-fonts')) : null;
    }
    const cached = document.querySelector('#view-sources template[data-view="' + pid + '"]');
    if(cached) return normSvg(cached.innerHTML);   // fetch 来的图自带 @font-face，无需补
    const page = PAGES[pid] || {};
    const href = page.svg || ((SITE.views_dir || 'views') + '/' + pid + '.svg');
    try{
      const r = await fetch(href, { cache: 'no-store' });
      if(!r.ok) return null;
      return normSvg(await r.text());
    }catch(e){
      return null;
    }
  }
  function mdCell(t){
    return String(t == null ? '' : t).replace(/\|/g, '\\|').replace(/\n/g, ' ');
  }
  function pageMarkdown(pid, page, hasImage){
    const out = [];
    const title = page.title || pid;
    out.push('# ' + title, '');
    const meta = [];
    if(page.type) meta.push(page.type);
    if(SITE.generated_at) meta.push('生成于 ' + SITE.generated_at);
    if(SITE.branch && SITE.baseline) meta.push('基线 ' + SITE.branch + '@' + SITE.baseline);
    if(meta.length) out.push('> ' + meta.join(' · '), '');
    if(page.summary) out.push(page.summary, '');
    if(hasImage) out.push('![' + title + '](./images/' + pid + '.svg)', '');
    if((page.points || []).length){
      out.push('## 怎么读这张图', '');
      for(const pt of page.points) out.push('- **' + pt[0] + '**：' + (pt[1] || ''));
      out.push('');
    }
    const codes = (page.code || []).filter(c => c.file);
    if(codes.length){
      out.push('## 对应代码', '', '| 节点 | 位置 | 符号 | 说明 |', '| --- | --- | --- | --- |');
      for(const c of codes){
        const sn = (SNIP[pid] || {})[c.id] || {};
        const sym = c.symbol || sn.symbol || '';
        const loc = '`' + c.file + ':' + (c.lines ? c.lines[0] : '-') + '-' + (c.lines ? c.lines[1] : '-') + '`';
        out.push('| ' + mdCell(c.id) + ' | ' + loc + ' | ' + mdCell(sym || '-') + ' | ' + mdCell(c.why || '') + ' |');
      }
      out.push('');
    }
    if((page.docs || []).length){
      out.push('## 参考文档', '');
      for(const d of page.docs) out.push('- ' + d);
      out.push('');
    }
    return out.join('\n');
  }
  function readmeMarkdown(groups){
    const out = ['# ' + (SITE.title || '项目知识地图'), ''];
    if(SITE.subtitle) out.push(SITE.subtitle, '');
    if(SITE.intro) out.push(SITE.intro, '');
    if(SITE.notice) out.push('> ' + SITE.notice, '');
    const meta = [];
    if(SITE.branch && SITE.baseline) meta.push('基线 ' + SITE.branch + '@' + SITE.baseline);
    if(SITE.generated_at) meta.push('生成于 ' + SITE.generated_at);
    meta.push(groups.reduce((a, g) => a + g.pages.length, 0) + ' 页');
    out.push(meta.join(' · '), '', '## 目录', '');
    for(const g of groups){
      const pid = g.pages[0];
      const page = PAGES[pid] || {};
      const trail = (g.path || []).join(' / ');
      out.push('- ' + (trail ? trail + ' → ' : '') + '[' + (page.title || pid) + '](' + g.dir + '/' + pid + '.md)');
    }
    out.push('');
    return out.join('\n');
  }
  function saveBlob(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  }
  async function exportBundle(){
    const btn = $('#exportBtn');
    const groups = navGroups();
    if(!groups.length){ alert('没有可导出的页面'); return; }
    const enc = new TextEncoder();
    const entries = [{ name: 'README.md', data: enc.encode(readmeMarkdown(groups)) }];
    let imgs = 0;
    for(const g of groups){
      for(const pid of g.pages){
        const page = PAGES[pid] || {};
        const svg = await svgSource(pid);          // 先拿图，md 才能决定是否写图片引用
        if(svg){
          entries.push({ name: g.dir + '/images/' + pid + '.svg', data: enc.encode(svg) });
          imgs++;
        }
        entries.push({ name: g.dir + '/' + pid + '.md',
                       data: enc.encode(pageMarkdown(pid, page, !!svg)) });
      }
    }
    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = '导出中…';
    try{
      const zip = await makeZip(entries);
      const stamp = (SITE.generated_at || new Date().toISOString().slice(0, 10))
        .replace(/[^\d-]/g, '').slice(0, 10) || new Date().toISOString().slice(0, 10);
      const base = String(SITE.title || 'atlas').replace(/[\/\\:*?"<>|\s]+/g, '-');
      saveBlob(zip, base + '-' + stamp + '.zip');
      btn.textContent = '已导出 ' + entries.length + ' 个文件' + (imgs ? ' · ' + imgs + ' 图' : ' · 无图');
      setTimeout(() => { btn.textContent = label; }, 2200);
    }catch(e){
      console.error(e);
      alert('导出失败：' + e.message);
      btn.textContent = label;
    }finally{
      btn.disabled = false;
    }
  }

  function go(id){
    const side = $('#side');
    if(side) side.classList.remove('open');
    if(location.hash.slice(1) === id){ cur = id; render(); }
    else { location.hash = id; }
  }

  function render(){
    renderSide();
    if(cur === 'home') renderHome(); else renderPage(cur);
  }

  $('#cpClose').onclick = closeCode;
  $('#tocBtn').onclick = () => $('#side').classList.toggle('open');
  $('#exportBtn').onclick = exportBundle;
  // 点面板以外的地方关闭抽屉（节点点击已 stopPropagation，不会误关）
  document.addEventListener('click', ev => {
    const panel = $('#panel');
    if(!panel || !panel.classList.contains('on')) return;
    if(ev.composedPath().includes(panel)) return;
    closeCode();
  });
  document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeCode(); });
  // 不注册 document 级点击关闭：点图空白不应收起抽屉

  // 返回 null（视为没有配置）或 {__error}（配置存在但有问题）或配置对象
  async function loadCfg(){
    try{
      const r = await fetch('atlas.config.json', { cache: 'no-store' });
      if(r.status === 404) return null;              // 没配置 → 用内置示例
      if(!r.ok) return { __error: 'atlas.config.json 读取失败：HTTP ' + r.status };
      const txt = await r.text();
      let cfg;
      try{
        cfg = JSON.parse(txt);
      }catch(e){
        return { __error: 'atlas.config.json 语法错误：' + e.message };
      }
      if(!cfg || !Array.isArray(cfg.nav)) return { __error: 'atlas.config.json 缺少 nav 数组' };
      return cfg;
    }catch(e){
      return null;                                   // file:// 下 fetch 被拦 → 用内置示例
    }
  }

  function showCfgError(msg){
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;padding:9px 16px;'
      + 'font:12.5px/1.6 -apple-system,sans-serif;color:#7a2e12;background:#fdf0e6;'
      + 'border-bottom:1px solid #f0d6bf';
    bar.textContent = '配置未生效：' + msg + '　（当前显示内置示例）';
    document.body.appendChild(bar);
  }

  (async function boot(){
    const isBaked = !!DEMO.baked;                    // 导出单文件：配置与图源都已内联
    let cfg = isBaked ? DEMO : await loadCfg();
    if(cfg && cfg.__error){ showCfgError(cfg.__error); cfg = null; }
    if(cfg){
      SITE = cfg;
      PAGES = cfg.pages || {};
      SNIP = cfg.snippets || {};
      SOURCE = isBaked ? 'demo' : 'file';            // baked 走内置图源，不 fetch
      if(!isBaked && !Object.keys(SNIP).length){
        try{
          const r = await fetch('snippets.json', { cache: 'no-store' });
          if(r.ok) SNIP = await r.json();
        }catch(e){ /* 无片段文件 */ }
      }
    }
    ITEMS = leaves();
    cur = fromHash();
    initCollapsed();
    expandPathTo(cur);
    document.title = (SITE.title || '项目知识地图') + (SITE.subtitle ? ' · ' + SITE.subtitle : '');
    const meta = $('#bbMeta');
    if(meta){
      meta.textContent = ITEMS.length + ' 页 · ' + (SITE.nav || []).length + ' 分类'
        + (SITE.demo ? ' · 示例' : '');
    }
    const bb = $('#bbText');
    if(bb){
      const parts = [];
      parts.push('基于 <b>' + esc(SITE.branch || 'unknown') + '</b> @ <code>' + esc(SITE.baseline || 'unknown') + '</code> 生成');
      if(SITE.generated_at) parts.push(esc(SITE.generated_at));
      parts.push('代码为生成时快照，不代表当前 HEAD');
      bb.innerHTML = parts.join('<span class="dot"></span>');
    }
    document.documentElement.setAttribute('data-atlas-source', SOURCE);
    render();
  })();
})();
</script>
</body>
